name: CI — Validate & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          docker compose version

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose -f docker-compose.yml config --quiet
          echo "✅ docker-compose.yml is valid"

  lint-python:
    name: Lint Python Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/monitoring-agent
          - services/analyzer-agent
          - services/auto-response-agent
          - services/notifier-agent
          - services/memory-agent
          - services/llm-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8 --quiet

      - name: Lint ${{ matrix.service }}
        run: |
          flake8 ${{ matrix.service }}/app \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --count --statistics \
          || echo "⚠️ Lint warnings found (non-blocking)"

  check-env-example:
    name: Verify .env.example has no real secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example for real key patterns
        run: |
          if grep -E "(sk-proj-[A-Za-z0-9_-]{40,}|sk-ant-api[A-Za-z0-9_-]{40,}|AIzaSy[A-Za-z0-9_-]{30,}|xoxb-[0-9]+-[0-9]+)" .env.example; then
            echo "❌ Real API key detected in .env.example!"
            exit 1
          else
            echo "✅ .env.example looks clean — no real secrets found"
          fi

  summary:
    name: CI Summary
    needs: [validate-compose, lint-python, check-env-example]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "========================================"
          echo "   Agentic DevOps System — CI Summary"
          echo "========================================"
          echo "✅ docker-compose.yml validated"
          echo "✅ Python services linted"
          echo "✅ .env.example checked for secrets"
          echo ""
          echo "Repo: https://github.com/mrs1409/Agentic_Devops_System"
